[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg"
version = "2.0.0"
description = "TRPG —— 单人 AI 跑团：完整《赛博朋克 RED》规则引擎 + AI 主持人/队友（夜之城 2045）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KananPond" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["cyberpunk-red", "ttrpg", "ai", "singleplayer", "chinese"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[tool.setuptools]
packages = ["trpg", "trpg.rules", "trpg.campaign", "trpg.harness",
            "trpg.game", "trpg.st", "trpg.ui", "trpg.web"]

[project.urls]
Homepage = "https://github.com/KananPond/TRPG"
